apiVersion: v1
kind: ServiceAccount
metadata:
  name: bge-m3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: embeddings
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bge-m3-models
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: embeddings
  annotations:
    # Uninstalling the release keeps the downloaded model; delete the claim by hand to free the volume.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.className | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.size | quote }}
---
# http://bge-m3.embeddings:11434: Ollama's API (POST /api/embed) and its OpenAI-compatible one (POST /v1/embeddings).
apiVersion: v1
kind: Service
metadata:
  name: bge-m3
  namespace: {{ .Release.Namespace }}
  labels:
    app: bge-m3
    app.kubernetes.io/part-of: embeddings
spec:
  type: ClusterIP
  selector:
    app: bge-m3
  ports:
    - name: http
      port: 11434
      targetPort: http
      appProtocol: http
