# Grafana folder MOKS: copies of moks-sre's deploy/grafana/dashboards/moks-*.json, which its deploy/grafana/build.py writes (edit
# them there and copy them here). JSON at the chart root, loaded verbatim (never templated).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-moks
  namespace: monitoring
data:
  {{- range $path, $_ := .Files.Glob "moks-*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
